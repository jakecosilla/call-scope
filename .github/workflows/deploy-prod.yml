name: Deploy PROD
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ secrets.ACR_NAME }}"
      - name: Resolve exact TEST-approved image digest
        run: |
          REPO=${{ secrets.ACR_LOGIN_SERVER }}/callscope-api
          docker pull "$REPO:test-approved"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REPO:test-approved")
          echo "IMAGE=$DIGEST" >> "$GITHUB_ENV"
      - run: az containerapp update --name "${{ secrets.PROD_CONTAINER_APP }}" --resource-group "${{ secrets.PROD_RESOURCE_GROUP }}" --image "$IMAGE"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.PROD_SWA_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
      - run: curl --fail --retry 12 --retry-delay 5 "${{ secrets.PROD_API_BASE_URL }}/api/health"
