name: Deploy TEST

on:
  push:
    branches: [ develop ]

jobs:
  deploy-test:
    name: Deploy to Azure TEST Environment
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Tag Immutable Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/callscope-api:sha-${IMAGE_TAG} ./backend
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/callscope-api:sha-${IMAGE_TAG}

      - name: Azure CLI Container App Deploy
        uses: azure/CLI@v1
        with:
          inlineScript: |
            IMAGE_TAG=${GITHUB_SHA::7}
            az containerapp update \
              --name callscope-api-test \
              --resource-group rg-callscope-test \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/callscope-api:sha-${IMAGE_TAG}

      - name: Verify Health Endpoint
        run: |
          curl -f https://test-api.callscope.ai/api/health || exit 1
